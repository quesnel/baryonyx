image: debian:sid

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build:
  stage: build
  before_script:
    - apt-get update && apt-get -y install cmake g++ ninja-build
  script:
    - cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
    - cmake --install build
    - ctest --test-dir build --output-on-failure -j 4
