name: Windows

on:
  push:
    branches: [ master, test ]
  pull_request:
    branches: [ master, test ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        BUILD_TYPE: [Debug, Release]

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: vcpkg install nlopt:x64-windows

    - name: Configure CMake
      run: cmake -B "${{ github.workspace }}/build" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config ${{ matrix.BUILD_TYPE }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ matrix.BUILD_TYPE }} --output-on-failure -j 4
